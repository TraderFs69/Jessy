name: Scanner canadien quotidien

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: pytest -q

      - name: Exécuter le scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scanner.main

      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-canada-results
          path: output/
          retention-days: 30
